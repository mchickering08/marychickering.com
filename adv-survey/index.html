<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ADV Applied Economics + Engineering Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
img{max-width:100%}
/* Layout: one question per screen in a centered 720px column. A thin bar under the
   header fills left to right through a skin-tone shade range as questions are answered. */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --panel:#E9E7E2; --ink:#111214; --ink-2:#5C5E62; --line:#DCDCD7;
  --accent:#1D3557; --accent-ink:#FFFFFF; --tint:#E6EBF2; --metal:#A88B5C; --lip:#A85D55;
  --t1:#F1D3BE; --t2:#E2B597; --t3:#C98F6B; --t4:#A26B4A; --t5:#6E4630; --t6:#43291C;
  --serif:"Libre Caslon Display","Big Caslon","Didot",Georgia,serif;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --surface:#1A1B1E; --panel:#1F2024; --ink:#F1F1EE; --ink-2:#A2A4A8; --line:#2E2F33;
    --accent:#9DB6D6; --accent-ink:#0D1420; --tint:#1C2533; --metal:#B79A6A; --lip:#C27A70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1A1B1E; --panel:#1F2024; --ink:#F1F1EE; --ink-2:#A2A4A8; --line:#2E2F33;
  --accent:#9DB6D6; --accent-ink:#0D1420; --tint:#1C2533; --metal:#B79A6A; --lip:#C27A70; color-scheme:dark;
}
html,body{margin:0;height:100%}
.app{min-height:100%;display:flex;flex-direction:column}
.app>main{flex:1 0 auto}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* illustration pigments */
.c-ink{fill:var(--ink)} .c-surf{fill:var(--surface)} .c-panel{fill:var(--panel)} .c-line{fill:var(--line)}
.c-metal{fill:var(--metal)} .c-lip{fill:var(--lip)} .c-acc{fill:var(--accent)}
.c-t1{fill:var(--t1)} .c-t2{fill:var(--t2)} .c-t3{fill:var(--t3)} .c-t4{fill:var(--t4)} .c-t5{fill:var(--t5)} .c-t6{fill:var(--t6)}
.c-ring{fill:none;stroke:var(--ink-2);stroke-width:2.5;stroke-dasharray:4 5}
.c-label{fill:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.1em}
.c-tag{fill:var(--ink);font-family:var(--sans);font-size:19px;font-weight:700}
.s-t2{fill:none;stroke:var(--t2)}

.preview-band{background:var(--ink);color:var(--bg);font-size:13px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.preview-band a{color:inherit}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.mark{font-family:var(--serif);font-size:24px;line-height:1;letter-spacing:.01em}
.partner{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-align:right}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4),var(--t5),var(--t6));background-size:100vw 100%;transition:width .35s ease}
.app[data-view="intro"] .progress,.app[data-view="end"] .progress{visibility:hidden}

.stage{padding-block:40px 64px}
@media (min-width:760px){.stage{padding-block:64px 88px}}
.col-q{max-width:720px;margin:0 auto}

/* type */
.label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
.label .n{color:var(--accent)}
.q-title{font-weight:600;font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-.015em;margin:0;text-wrap:balance;outline:none}
.q-help{color:var(--ink-2);margin:10px 0 0;max-width:60ch}
.answers{margin-top:28px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap}
.nav-right{display:flex;align-items:center;gap:16px;margin-left:auto}
.count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.count.warn{color:var(--lip)}

.btn{border:0;cursor:pointer;font-weight:600;font-size:16px;line-height:1;padding:15px 26px;border-radius:8px;transition:opacity .2s,transform .1s}
.btn:active{transform:translateY(1px)}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:disabled{opacity:.3;cursor:not-allowed;transform:none}
.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.text-btn{background:none;border:0;color:var(--ink-2);cursor:pointer;padding:8px 0;font-size:15px;text-decoration:underline;text-underline-offset:4px}

/* option cards with illustrations */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;font-weight:500;font-size:15px;line-height:1.3;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.card svg{width:52px;height:52px;flex:none}
.card small{display:block;font-weight:400;font-size:13px;color:var(--ink-2);margin-top:2px}
.card:hover{border-color:var(--ink-2)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:4px;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.tick svg{width:12px;height:12px}
[aria-pressed="true"]>.tick{display:grid}
.cards.check{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){.cards.check{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cards.check .card{align-items:center;padding:22px 10px}
.cards.check .card svg{width:68px;height:68px}

/* frequency rows */
.rows{display:grid;gap:8px}
.rows .card{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;font-size:16px}
.dots{display:flex;gap:4px;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:block}
.dots i.f{background:var(--accent);box-shadow:none}
.dots i.x{box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.dots-label{display:block;font-size:12px;color:var(--ink-2);margin-top:5px;text-align:right}

/* choices */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;line-height:1.25;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.stack{flex-direction:column;align-items:stretch}
.chips.stack .chip{padding:15px 18px;font-size:16px}
.group+.group{margin-top:28px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* which best describes you */
.pairs{display:grid;gap:24px}
.pair-q{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair .card{flex-direction:row;align-items:center;gap:14px;padding:14px 40px 14px 14px}
.pair .card>svg{width:60px;height:60px;padding:6px;border-radius:8px;background:var(--panel)}
.pair .card b{display:block;font-size:16px;font-weight:600}
.pair .card small{margin-top:3px}
@media (max-width:540px){.pair .card{flex-direction:column;align-items:flex-start;padding:14px}}

/* price */
.price-read{font-family:var(--serif);font-size:clamp(56px,11vw,88px);line-height:1;margin:0;font-variant-numeric:tabular-nums}
.price-read small{font-family:var(--sans);font-size:15px;color:var(--ink-2);margin-left:8px}
.range{width:100%;margin:22px 0 10px;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,30%),var(--line) var(--p,30%));outline-offset:8px}
.range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:grab}
.ticks{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 1-5 scale */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;line-height:1.2;text-align:center}
.scale b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

.concept{display:grid;gap:22px;margin-top:24px}
.art{border-radius:12px;overflow:hidden;line-height:0;background:var(--panel)}
.art svg{width:100%;height:auto;display:block}
.concept-card{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
@media (min-width:640px){.concept-card{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
.concept-art{background:var(--panel);line-height:0;display:flex;align-items:center}
.concept-art svg{width:100%;height:auto;display:block}
.concept-body{padding:22px;display:grid;gap:16px;align-content:start}
.concept-name{font-family:var(--serif);font-size:28px;line-height:1.1;margin:0}
.features{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.features li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.features .fi{width:34px;height:34px;border-radius:8px;background:var(--tint);color:var(--accent);display:grid;place-items:center}
.features .fi svg{width:18px;height:18px}
.features b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.features span{display:block;font-size:14px;color:var(--ink-2);line-height:1.4}
.ba{display:flex;align-items:center;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.ba figure{margin:0;display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.ba figure svg{width:58px;height:58px}
.ba .arrow{width:28px;height:14px;color:var(--ink-2);flex:none;margin-bottom:18px}

.field{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:500 17px/1.3 var(--sans)}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
textarea.field{min-height:130px;resize:vertical;line-height:1.45}
.stack-gap{display:grid;gap:14px}
.hint{font-size:14px;color:var(--ink-2);margin:8px 0 0}

/* cover */
.intro{display:grid;gap:32px;align-items:center}
@media (min-width:880px){.intro{grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:64px}}
.intro-title{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.6vw,52px);line-height:1.08;letter-spacing:-.005em;margin:0;text-wrap:balance}
.lede{font-size:17px;max-width:50ch;margin:18px 0 0;color:var(--ink)}
.facts{list-style:none;padding:0;margin:22px 0 26px;display:flex;flex-wrap:wrap;gap:8px}
.facts li{font-size:14px;font-weight:500;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.fine{font-size:13px;color:var(--ink-2);max-width:56ch;margin:18px 0 0}
.sel{user-select:all;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.friend{font-size:14px;font-weight:600;color:var(--accent);margin:0 0 12px}

/* results */
.result{display:grid;gap:28px}
@media (min-width:880px){.result{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:56px;align-items:start}}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary-head{padding:24px 24px 20px;border-bottom:1px solid var(--line)}
.type-name{font-family:var(--serif);font-size:clamp(34px,5vw,44px);line-height:1.05;margin:4px 0 8px}
.type-line{margin:0;color:var(--ink-2)}
.shade-strip{display:grid;grid-template-columns:repeat(6,1fr);height:8px}
.shade-strip i:nth-child(1){background:var(--t1)}.shade-strip i:nth-child(2){background:var(--t2)}.shade-strip i:nth-child(3){background:var(--t3)}
.shade-strip i:nth-child(4){background:var(--t4)}.shade-strip i:nth-child(5){background:var(--t5)}.shade-strip i:nth-child(6){background:var(--t6)}
.glance{margin:0;padding:8px 24px 16px}
.glance div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding-block:10px;border-bottom:1px solid var(--line);font-size:15px}
.glance div:last-child{border-bottom:0}
.glance dt{color:var(--ink-2)} .glance dd{margin:0;font-weight:500}
.col{display:grid;gap:28px;min-width:0}
.h2{font-weight:600;font-size:21px;line-height:1.25;margin:0 0 10px}
.stats{border-top:1px solid var(--line)}
.stat{display:grid;grid-template-columns:5.2ch 1fr;gap:16px;align-items:baseline;padding-block:14px;border-bottom:1px solid var(--line)}
.stat b{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span q{font-style:italic}
.share{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.share p{margin:0 0 14px;max-width:60ch}
.linkbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.linkbox .field{font-size:14px}
.mini{font-size:14px;color:var(--ink-2);margin:12px 0 0}
.mini b{color:var(--ink)}
.board{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.board li{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:12px;align-items:center;font-size:15px}
.board .rk{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.board .nm{min-width:0}
.board .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .bar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.board .bar i{display:block;height:100%;background:var(--t3)}
.board li.me .bar i{background:var(--accent)}
.board li.me .nm span{font-weight:600}
.board .n{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.example-note{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--lip);margin:0}

/* link tracker */
.hub{display:grid;gap:26px;max-width:720px;margin:0 auto}
.goal-grid{display:grid;grid-template-columns:repeat(5,minmax(0,40px));gap:10px;margin:16px 0 10px}
.goal-grid i{aspect-ratio:1/1;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.goal-grid i.on{background:var(--accent);box-shadow:none}
.hub-num{font-family:var(--serif);font-size:clamp(48px,8vw,72px);line-height:1;margin:8px 0 0;font-variant-numeric:tabular-nums}
.hub-num small{font-family:var(--sans);font-size:16px;color:var(--ink-2);margin-left:6px}
.code-tag{font-weight:600;font-size:14px;letter-spacing:.1em;background:var(--tint);color:var(--ink);padding:6px 10px;border-radius:6px;display:inline-block}

.end{max-width:620px;margin:0 auto;padding-block:20px}
.end h1{font-weight:600;font-size:clamp(28px,4.4vw,40px);line-height:1.15;margin:0 0 14px;text-wrap:balance}
.end p{font-size:17px;margin:0 0 14px}

.foot{border-top:1px solid var(--line);color:var(--ink-2);font-size:13px;background:var(--surface)}
.foot .wrap{padding-block:18px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}

.fade{animation:fade .25s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ---------- additions for the two-part local version ---------- */
.app[data-view="admin"] .progress{visibility:hidden}
.top-in{flex-wrap:wrap}
.steps{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.app:not([data-view="q"]) .steps{visibility:hidden}
.steps span[data-s]{display:flex;align-items:center;gap:7px}
.steps b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;box-shadow:inset 0 0 0 1.5px var(--line)}
.steps .on{color:var(--ink)}
.steps .on b{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.steps .done b{background:var(--ink-2);color:var(--surface);box-shadow:none}
.steps .bg-step.on{color:var(--ink)}
.steps .sep{width:28px;height:1px;background:var(--line)}
@media (max-width:640px){.partner{display:none}}
.other-wrap{margin-top:14px}
.interlude .art{margin-top:28px}
.summary-head+.summary-head{border-top:0}
.admin{max-width:720px;margin:0 auto;display:grid;gap:8px}
.big-num{font-family:var(--serif);font-size:clamp(48px,8vw,72px);line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.big-num small{font-family:var(--sans);font-size:16px;color:var(--ink-2);margin-left:6px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 22px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-top:12px}
.res .h2{margin:0 0 2px}
.part-h{font-family:var(--serif);font-size:30px;font-weight:400;margin:36px 0 4px}
.res .board{margin-top:14px}
.res .board li{grid-template-columns:minmax(0,1fr) auto}
.res .board .nm span{white-space:normal}
.res .board .n{white-space:nowrap}
.others{margin:14px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.others li+li{margin-top:6px}
.foot a{color:inherit}
.lede strong{font-weight:700}
.time-est{margin:26px 0 8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.sections-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;border-radius:10px;overflow:hidden;margin:0 0 26px;max-width:520px}
.sections-bar span{padding:13px 6px;text-align:center;font-size:14px;font-weight:600;color:#111214;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sections-bar span:nth-child(1){background:var(--t1)}
.sections-bar span:nth-child(2){background:var(--t2)}
.sections-bar span:nth-child(3){background:var(--t3)}
.sections-bar span:nth-child(4){background:var(--t4);color:#fff}
@media (max-width:420px){.sections-bar span{font-size:12px;padding:12px 3px}}
.mark{font-size:21px;line-height:1.15}
.segs{border-top:1px solid var(--line)}
.app[data-view="intro"] .segs,.app[data-view="admin"] .segs{display:none}
.segs-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-block:10px 12px}
.seg-top{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px;white-space:nowrap}
.seg-n{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.seg.on .seg-top{color:var(--ink)}
.seg-track{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.seg-track i{display:block;height:100%;width:0;transition:width .35s ease}
.seg[data-p="0"] .seg-track i{background:var(--t2)}
.seg[data-p="1"] .seg-track i{background:var(--t3)}
.seg[data-p="2"] .seg-track i{background:var(--t4)}
.seg[data-p="3"] .seg-track i{background:var(--t5)}
.seg.on .seg-track{box-shadow:0 0 0 1px var(--ink-2)}

.stat{grid-template-columns:minmax(5.2ch,auto) 1fr}

/* ================= look ================= */
:root[data-theme="light"]{
  --bg:#F5F7FA; --surface:#FFFFFF; --panel:#E8EDF4; --ink:#141C2B; --ink-2:#5A6578; --line:#DCE2EB;
  --accent:#1F3A5F; --accent-ink:#FFFFFF; --tint:#E9EFF7; --metal:#B89B6A; --lip:#B4463F;
  --serif:"Cormorant Garamond","Cormorant",Garamond,Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --rose1:#DDE6F1; --rose2:#AFC1D8; --rose3:#5B78A1; --rose4:#2C4870;
  --shadow:0 1px 2px rgba(16,26,44,.04),0 8px 24px rgba(16,26,44,.06);
  color-scheme:light;
}
body{font-family:var(--sans);background:
  radial-gradient(900px 520px at 92% -8%, #DEE7F3 0%, rgba(222,231,243,0) 62%),
  radial-gradient(800px 480px at -12% 108%, #EAEEF4 0%, rgba(234,238,244,0) 60%), var(--bg);background-attachment:fixed}
.top{background:rgba(245,247,250,.82);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.mark{font-family:var(--serif);font-style:italic;font-weight:500;font-size:23px;letter-spacing:0}
.partner{font-size:11px;letter-spacing:.2em;font-weight:500;color:var(--ink-2)}
.segs{border-top:0}
.seg-top{text-transform:none;letter-spacing:.01em;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg.on .seg-top{color:var(--accent)}
.seg.on .seg-track{box-shadow:none}
.seg-track{height:4px;border-radius:99px;background:#E2E8F0}
.seg[data-p="0"] .seg-track i{background:var(--rose1)}
.seg[data-p="1"] .seg-track i{background:var(--rose2)}
.seg[data-p="2"] .seg-track i{background:var(--rose3)}
.seg[data-p="3"] .seg-track i{background:var(--rose4)}
.seg-track i{border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}

.label{text-transform:none;letter-spacing:.01em;font-size:15px;font-weight:500;color:var(--ink-2)}
.label .n{color:var(--accent);font-weight:500}
.q-title{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,48px);line-height:1.08;letter-spacing:-.005em}
.q-help{font-size:16px}
.answers{margin-top:30px}

.chip{border-radius:999px;padding:12px 20px;border-color:var(--line);background:var(--surface);box-shadow:0 1px 2px rgba(16,26,44,.04);font-weight:400;font-size:16px;transition:background .18s,border-color .18s,box-shadow .18s,transform .12s}
.chip:hover{border-color:#B4C3D7;transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(31,58,95,.25)}
.chips.stack .chip{border-radius:16px;padding:16px 20px}
.group .label{font-size:14px;margin-bottom:12px}

.card{border-radius:20px;border-color:var(--line);box-shadow:var(--shadow);font-weight:400;font-size:16px;transition:border-color .18s,background .18s,transform .12s,box-shadow .18s}
.card:hover{border-color:#B4C3D7;transform:translateY(-1px)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent),0 8px 22px rgba(31,58,95,.12)}
.tick{border-radius:50%;background:var(--accent)}
.rows .card{padding:18px 22px}
.dots i.f{background:var(--accent)}
.pair .card>svg{background:var(--panel);border-radius:14px}
.pair-q{text-transform:none;letter-spacing:.01em;font-size:15px;font-weight:500}

.scale button{border-radius:18px;border-color:var(--line);box-shadow:var(--shadow);font-weight:400;font-size:14px}
.scale b{font-size:32px;font-weight:500}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(31,58,95,.25)}

.btn{border-radius:999px;font-weight:500;letter-spacing:.02em;padding:16px 32px}
.primary{background:var(--accent);box-shadow:0 8px 22px rgba(31,58,95,.22)}
.primary:hover:not(:disabled){background:#162B48}
.secondary{border-radius:999px}
.text-btn{text-decoration:none;color:var(--ink-2);font-size:16px}
.text-btn:hover{color:var(--ink)}
.count{font-size:14px}
.field{border-radius:16px;border-color:var(--line);font-family:var(--sans);font-weight:400}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,58,95,.12)}
.range{background:linear-gradient(90deg,var(--accent) var(--p,30%),var(--line) var(--p,30%))}
.range::-webkit-slider-thumb{border-color:var(--accent)}
.price-read{font-weight:500}

.intro-title{font-weight:400;font-size:clamp(40px,5.2vw,62px);line-height:1.04;letter-spacing:-.01em}
.intro-title em{font-style:italic;color:var(--accent)}
.intro .label{color:var(--accent)}
.lede{font-size:18px;line-height:1.6;color:#384356}
.lede strong{color:var(--ink);font-weight:600}
.time-est{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:.01em;font-size:15px;font-weight:500;color:var(--ink-2);margin:28px 0 10px}
.time-est svg{width:16px;height:16px}
.sections-bar{border-radius:999px;gap:0;box-shadow:var(--shadow);max-width:540px}
.sections-bar span{font-weight:500;font-size:14px;padding:14px 6px;color:var(--ink)}
.sections-bar span:nth-child(1){background:var(--rose1)}
.sections-bar span:nth-child(2){background:var(--rose2)}
.sections-bar span:nth-child(3){background:var(--rose3);color:#fff}
.sections-bar span:nth-child(4){background:var(--rose4);color:#fff}
.fine{font-size:14px}
.art{border-radius:28px;box-shadow:var(--shadow)}

.summary{border-radius:24px;border-color:var(--line);box-shadow:var(--shadow)}
.summary-head .label{font-size:14px}
.type-name{font-weight:500}
.shade-strip{height:6px}
.stat b{font-weight:500;font-size:36px;color:var(--accent)}
.share{border-radius:24px;border-color:var(--line);box-shadow:var(--shadow)}
.h2{font-family:var(--serif);font-weight:500;font-size:27px}
.res{border-radius:20px;border-color:var(--line);box-shadow:var(--shadow)}
.part-h{font-weight:500}
.big-num{font-weight:500;color:var(--accent)}
.res .board .bar i{background:var(--rose3)}
.foot{background:transparent;border-top:1px solid var(--line)}
.sec-title{font-family:var(--serif);font-weight:400;font-size:clamp(52px,8vw,84px);line-height:1;margin:0;letter-spacing:-.01em;outline:none}
.sec-meta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}
.sec-meta span{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:500;color:var(--ink);box-shadow:0 1px 2px rgba(16,26,44,.04)}
.sec-meta svg{width:16px;height:16px;color:var(--accent)}
.interlude .q-help{margin-top:14px}
.login{max-width:440px;margin:0 auto}
.login-form{display:grid;gap:16px;margin-top:26px}
.login-form label{display:grid;gap:8px;font-size:15px;font-weight:500;color:var(--ink-2)}
.login-err{margin:0;color:var(--lip);font-size:15px}
.login .nav{margin-top:8px}
.foot .login-link{font-weight:500;text-decoration:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.foot .login-link:hover{border-color:var(--accent);color:var(--accent)}
.draw-title{font-size:clamp(44px,6.5vw,68px)}
.draw-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px 12px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:200px;text-align:center}
.slot-n{font-size:14px;font-weight:500;color:var(--ink-2)}
.slot-ico svg{width:68px;height:68px;display:block}
.slot-name{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.1;min-height:1.1em}
.slot.spinning .slot-name{color:var(--ink-2)}
.slot.set{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow);animation:pop .4s cubic-bezier(.2,.7,.2,1)}
.slot.set .slot-n{color:var(--accent)}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@media (max-width:520px){.slot{min-height:160px;padding:16px 6px}.slot-name{font-size:21px}.slot-ico svg{width:52px;height:52px}.draw-slots{gap:8px}}
.pitch{display:grid;gap:22px}
.fc-card{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}
.fc-art svg{width:100%;height:auto;display:block}
.fc-kicker{margin:0;font-size:14px;font-weight:500;color:var(--accent)}
.fc-name{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1;margin:4px 0 10px}
.fc-body p{margin:0 0 10px;color:#384356}
.fc-list{margin:0;padding-left:18px;color:#384356;display:grid;gap:5px;font-size:15px}
@media (max-width:560px){.fc-card{grid-template-columns:96px 1fr;gap:14px;padding:16px}.fc-name{font-size:30px}.fc-list{font-size:14px}}
#start{display:inline-flex;align-items:center;gap:10px}
#start .shuf{width:18px;height:18px}
#start:disabled{opacity:1;cursor:default}
.sections-bar span{transition:transform .2s}
.sections-bar span.spin{opacity:.75}
.sections-bar span.set{animation:pop .4s cubic-bezier(.2,.7,.2,1)}
.sections-bar .dash{display:inline-block;width:22px;height:2px;border-radius:2px;background:currentColor;opacity:.55;vertical-align:middle}
.win{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px}
.win.grow{inset:auto;border-radius:0;transition:left 1.1s cubic-bezier(.65,0,.25,1),top 1.1s cubic-bezier(.65,0,.25,1),width 1.1s cubic-bezier(.65,0,.25,1),height 1.1s cubic-bezier(.65,0,.25,1)}
.win-in{opacity:0;transition:opacity .3s ease}
.win.open .win-in{opacity:1}
.win-list{list-style:none;margin:6px 0 40px;padding:0;display:grid;gap:6px}
.win-list li{display:flex;align-items:baseline;justify-content:center;gap:18px;opacity:0;transform:translateY(12px);transition:opacity .45s ease var(--d),transform .45s cubic-bezier(.2,.7,.2,1) var(--d)}
.win.open .win-list li{opacity:1;transform:none}
.win-n{font-size:18px;font-weight:600;opacity:.6;min-width:1ch}
.win-list li:first-child .win-name{opacity:.7}
.win.leave{opacity:0;transition:opacity .3s ease}
.win-k{margin:0 0 6px;font-size:16px;font-weight:500;opacity:.8}
.win-name{font-family:var(--serif);font-weight:500;font-size:clamp(40px,7.5vw,84px);line-height:1.08;letter-spacing:-.01em}
.win-go{background:var(--accent);color:#fff;font-size:18px;padding:19px 40px;box-shadow:0 12px 30px rgba(14,26,46,.28);opacity:0;transition:opacity .4s ease .55s,background .2s}
.win.open .win-go{opacity:1}
.win-go:hover{background:#162B48}
.band-wrap{position:fixed;inset:0;z-index:40;display:grid;align-items:center;pointer-events:auto;background:rgba(245,247,250,0);transition:background .35s ease}
.band-wrap.in{background:rgba(245,247,250,.55)}
.band-wrap.out{background:rgba(245,247,250,0)}
.band{width:100%;min-height:150px;display:grid;place-items:center;color:var(--ink);transform:translateX(-102%);transition:transform .5s cubic-bezier(.7,0,.2,1);box-shadow:0 20px 50px rgba(16,26,44,.14)}
.band.light{color:#fff}
.band-wrap.in .band{transform:none}
.band-wrap.out .band{transform:translateX(102%)}
.band-in{display:flex;align-items:center;gap:22px;padding:26px 24px}
.tick-wrap{position:relative;width:58px;height:58px;flex:none}
.tick-svg{width:58px;height:58px;display:block}
.tick-c{fill:none;stroke:currentColor;stroke-width:3;stroke-dasharray:145;stroke-dashoffset:145;transform:rotate(-90deg);transform-origin:center;opacity:.9}
.tick-p{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:36}
.band-wrap.checked .tick-c{animation:draw .45s cubic-bezier(.6,0,.3,1) forwards}
.band-wrap.checked .tick-p{animation:draw .3s cubic-bezier(.5,0,.2,1) .35s forwards}
.band-wrap.checked .tick-svg{animation:tickpop .5s cubic-bezier(.2,.8,.2,1.4) .55s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes tickpop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:currentColor;opacity:0;transform:rotate(var(--a)) translateY(0)}
.band-wrap.checked .burst i{animation:burst .6s cubic-bezier(.2,.7,.2,1) .6s forwards}
@keyframes burst{0%{opacity:.9;transform:rotate(var(--a)) translateY(-10px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(-44px) scale(.4)}}
.band-text{display:grid;text-align:left}
.band-done{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,56px);line-height:1.05}
.band-next{font-size:18px;font-weight:500;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease;margin-top:6px}
.band-wrap.next .band-next{opacity:.85;transform:none}
.top-in{flex-wrap:nowrap}
.tally{display:flex;align-items:center;gap:6px;flex:none;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:0 1px 2px rgba(16,26,44,.04)}
.tally-k{font-weight:500;margin-right:4px}
.tally-g{display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:999px;background:var(--bg);font-weight:500;color:var(--ink);white-space:nowrap}
.tally-g b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
.tally-g.lead{background:var(--accent);color:#fff}
.tally-g.lead b{color:#fff}
.tally-g.bump{animation:pop .45s cubic-bezier(.2,.7,.2,1)}
@media (max-width:860px){.tally-k{display:none}.tally{padding:5px;gap:4px}.tally-g{padding:3px 7px;font-size:12px}}
@media (max-width:640px){.top-in{flex-wrap:wrap;row-gap:8px}.mark{font-size:19px}}
.done-btn{background:var(--ink-2)!important;box-shadow:none!important;cursor:default}
.test-band{background:var(--accent);color:#fff;text-align:center;font-size:14px;font-weight:500;letter-spacing:.02em;padding:7px 16px}
.fade{animation:fade .35s cubic-bezier(.2,.7,.2,1) both}
</style>

<body>
<div class="app" id="app" data-view="intro">
  <div class="test-band" id="testBand" hidden>Test mode: answers aren’t saved, and you can take it more than once.</div>
  <header class="top">
    <div class="wrap top-in">
      <span class="mark">ADV Applied Economics + Engineering Survey</span>
      <div class="tally" id="tally" aria-label="Responses so far by grade">
        <span class="tally-k">Responses</span>
        <span class="tally-g" data-g="9th grade">9th <b>–</b></span><span class="tally-g" data-g="10th grade">10th <b>–</b></span><span class="tally-g" data-g="11th grade">11th <b>–</b></span><span class="tally-g" data-g="12th grade">12th <b>–</b></span>
      </div>
    </div>
    <div class="segs" aria-hidden="true"><div class="wrap segs-in" id="segs">
      <div class="seg" data-p="0"><div class="seg-top"><span>Background</span><span class="seg-n"></span></div><div class="seg-track"><i></i></div></div>
      <div class="seg" data-p="1"><div class="seg-top"><span>Makeup</span><span class="seg-n"></span></div><div class="seg-track"><i></i></div></div>
      <div class="seg" data-p="2"><div class="seg-top"><span>Skincare</span><span class="seg-n"></span></div><div class="seg-track"><i></i></div></div>
      <div class="seg" data-p="3"><div class="seg-top"><span>Fragrance</span><span class="seg-n"></span></div><div class="seg-track"><i></i></div></div>
    </div></div>
  </header>
  <main class="wrap stage">
    <section id="screen" aria-live="polite"></section>
  </main>
  <footer class="foot">
    <div class="wrap">
      <span>A Greenwich Country Day School student research project.</span>
      <a href="#login" class="login-link">Log in</a>
    </div>
  </footer>
</div>

    rec.would_try_concept = Number(a.concept_try) >= 4 ? 'yes' : 'no';
    rec.luxury_user = Array.isArray(a.s_brands) ? (a.s_brands.some(function (b) { return LUXURY.indexOf(b) !== -1; }) ? 'yes' : 'no') : '';
    rec.omoggle_aware = a.omoggle && a.omoggle !== OM_NO ? 'yes' : 'no';
    rec.facecard_yes = FC_SCALE.indexOf(a.facecard) >= 3 ? 'yes' : 'no';
    rec.owns_fragrance = a.f_own === 'Yes' ? 'yes' : 'no';
    rec.buys_in_store = (a.f_where || []).some(function (x) { return F_INPERSON.indexOf(x) !== -1; }) ? 'yes' : 'no';
    if (TEST_MODE) { if (rec.grade) testTally[rec.grade] = (testTally[rec.grade] || 0) + 1; updateTally(testTally); return renderResult(rec, mt, st, ft, null); }
    if (!LIVE) { var all = loadAll(); all.push(rec); saveAll(all); markDone(); updateTally(countGrades(all)); return renderResult(rec, mt, st, ft, summarize(all, rec)); }
    sendToSheet(rec, mt, st, ft);
  }
  function summarize(all, rec) {
    function c(f) { return all.filter(f).length; }
    return { n: all.length, freq: c(function (x) { return x.freq === rec.freq; }), s_freq: c(function (x) { return x.s_freq === rec.s_freq; }),
      concept: c(function (x) { return x.would_try_concept === 'yes'; }), users: c(function (x) { return x.luxury_user === 'yes' || x.luxury_user === 'no'; }),
      lux: c(function (x) { return x.luxury_user === 'yes'; }), omoggle: c(function (x) { return x.omoggle_aware === 'yes'; }), facecard: c(function (x) { return x.facecard_yes === 'yes'; }), owns: c(function (x) { return x.owns_fragrance === 'yes'; }) };
  }
  function sendToSheet(rec, mt, st, ft) {
    setView('result'); setStep(-1); progress(true);
    screen.innerHTML = '<div class="col-q fade"><p class="label"><span class="n">Almost there</span></p><h1 class="q-title">Saving your answers…</h1></div>';
    fetch(SHEET_URL, { method: 'POST', body: JSON.stringify({ action: 'submit', response: rec }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res || !res.ok) throw new Error(res && res.error); markDone(); if (res.summary && res.summary.grades) updateTally(res.summary.grades); renderResult(rec, mt, st, ft, res.summary || null); })
      .catch(function () {
        screen.innerHTML = '<div class="col-q fade"><p class="label"><span class="n">Not saved yet</span></p><h1 class="q-title">Your answers didn’t send.</h1>' +
          '<p class="q-help">Check your internet connection and try again. Your answers are still here.</p><div class="nav"><span></span><button class="btn primary" id="retry">Try again</button></div></div>';
        document.getElementById('retry').addEventListener('click', function () { sendToSheet(rec, mt, st, ft); });
      });
  }

  /* ---------- thank-you screen ---------- */
  function pct(part, whole) { return whole ? Math.round(part / whole * 100) : 0; }
  function renderResult(rec, mt, st, ft, s) {
    setView('result'); setStep(-1); progress(true);
    var n = s ? s.n : 0, stats = '';
    if (!s) stats = '<p class="mini">Test mode is on, so this response wasn’t saved and there’s nothing to compare yet.</p>';
    else {
      stats = '<div class="stat"><b>' + n + '</b><span>' + (n === 1 ? 'response' : 'responses') + ' so far, including yours.</span></div>';
      if (n >= 5) {
        stats += '<div class="stat"><b>' + pct(s.freq, n) + '%</b><span>also answered <q>' + esc(rec.freq) + '</q> for makeup.</span></div>';
        stats += '<div class="stat"><b>' + pct(s.s_freq, n) + '%</b><span>also answered <q>' + esc(rec.s_freq) + '</q> for skincare.</span></div>';
        stats += '<div class="stat"><b>' + pct(s.concept, n) + '%</b><span>would probably or definitely try the concealer stick. You said <q>' + esc(SCALE[(rec.concept_try || 1) - 1]) + '</q>.</span></div>';
        if (s.users) stats += '<div class="stat"><b>' + pct(s.lux, s.users) + '%</b><span>of skincare users use at least one luxury skincare brand.</span></div>';
        stats += '<div class="stat"><b>' + pct(s.omoggle, n) + '%</b><span>have heard of or used Omoggle.</span></div>';
        stats += '<div class="stat"><b>' + pct(s.facecard, n) + '%</b><span>are interested or very interested in Face Card.</span></div>';
        stats += '<div class="stat"><b>' + pct(s.owns, n) + '%</b><span>own a fragrance.</span></div>';
      } else stats += '<p class="mini">Comparisons show up once 5 people have finished.</p>';
    }
    var rows = glance(rec).concat(skinGlance(rec), fragGlance(rec));
    screen.innerHTML = '<div class="result fade">' +
      '<div class="col"><div class="summary">' +
        '<div class="summary-head"><p class="label">Your makeup type</p><p class="type-name">' + esc(mt.name) + '</p><p class="type-line">' + esc(mt.line) + '</p></div>' +
        '<div class="summary-head"><p class="label">Your skincare type</p><p class="type-name">' + esc(st.name) + '</p><p class="type-line">' + esc(st.line) + '</p></div>' +
        '<div class="summary-head"><p class="label">Your scent profile</p><p class="type-name">' + esc(ft.name) + '</p><p class="type-line">' + esc(ft.line) + '</p></div>' +
        '<div class="shade-strip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
        '<dl class="glance">' + rows.map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl>' +
        (n ? '<p class="mini" style="padding:0 24px 18px;margin:0">Response ' + n + '</p>' : '') +
      '</div></div>' +
      '<div class="col">' +
        '<div><p class="label">All done · Thank you</p><h1 class="q-title">How your answers compare</h1></div>' +
        '<div class="stats">' + stats + '</div>' +
        (TEST_MODE
          ? '<div class="share"><h2 class="h2">Testing?</h2><p>Test mode lets you go again. Once the survey is live, each computer can only take it once.</p>' +
            '<button class="btn primary" id="again">Start a new response</button><p class="mini" id="resetNote"></p></div>'
          : '<div class="share"><h2 class="h2">You’re all set</h2><p>Your answers are saved. Thanks for helping with our research!</p></div>') +
      '</div></div>';
    if (!TEST_MODE) { toTop(); return; }
    document.getElementById('again').addEventListener('click', renderIntro);
    var left = RESET_SECONDS, note = document.getElementById('resetNote');
    (function tick() {
      if (!document.getElementById('resetNote')) return;
      note.textContent = 'Resets automatically in ' + left + 's.';
      if (left-- <= 0) return renderIntro();
      resetTimer = setTimeout(tick, 1000);
    })();
    toTop();
  }

  /* ---------- results page (#results) ---------- */
  function plainTitle(q) { return q.rl || RL[q.id] || String(typeof q.title === 'function' ? q.id : q.title); }
  var REPORT = [];
  Q.forEach(function (q) {
    var part = q.part;
    if (q.type === 'interlude' || q.type === 'draw') return;
    if (q.type === 'about') { REPORT.push({ id: 'age', part: 0, label: 'Age', options: AGES }, { id: 'gender', part: 0, label: 'Gender', options: GENDERS }); return; }
    if (q.type === 'pairs') { q.pairs.forEach(function (p) { REPORT.push({ id: p.id, part: 1, label: 'Which best describes you: ' + p.q.toLowerCase(), options: [p.a.v, p.b.v] }); }); return; }
    var r = { id: q.id, part: part, label: plainTitle(q), options: q.options && typeof q.options !== 'function' ? optList(q).map(function (o) { return o.v; }) : [], others: othersOf(q), multi: q.type === 'cardsMulti' || q.type === 'chipsMulti', type: q.type };
    if (q.type === 'concept') { r.label = 'Would try the 10-second concealer stick'; r.options = SCALE.map(function (s, i) { return String(i + 1); }); r.fmt = function (v) { return v + ' · ' + SCALE[v - 1]; }; }
    if (q.type === 'slider') { r.numeric = true; r.fmt = function (v) { return '$' + v + (Number(v) >= q.max ? '+' : ''); }; }
    if (q.type === 'text' || q.type === 'short') r.textOnly = true;
    REPORT.push(r);
  });

  /* ---------- login (results are for the survey team only) ---------- */
  var LOGIN_HASH = 3183140352271974; // hash of "USERNAME:password", so the login isn't sitting in the code as plain text
  function cyrb53(s) { var h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (var i = 0, ch; i < s.length; i++) { ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); }
  var authed = false;
  try { authed = sessionStorage.getItem('adv-admin') === '1'; } catch (e) { }
  var adminPw = '';
  try { adminPw = sessionStorage.getItem('adv-admin-pw') || ''; } catch (e) { }
  function setAuthed(v, pw) { authed = v; adminPw = v ? (pw || adminPw) : ''; try { if (v) { sessionStorage.setItem('adv-admin', '1'); sessionStorage.setItem('adv-admin-pw', adminPw); } else { sessionStorage.removeItem('adv-admin'); sessionStorage.removeItem('adv-admin-pw'); } } catch (e) { } }

  function renderLogin() {
    clearReset(); setView('admin'); A = {}; trail = [];
    screen.innerHTML = '<div class="login fade">' +
      '<p class="label"><span class="n">Survey team</span></p>' +
      '<h1 class="sec-title" style="font-size:clamp(44px,6vw,64px)">Log in</h1>' +
      '<p class="q-help">Results are only for the survey team.</p>' +
      '<div id="loginForm" class="login-form">' +
        '<label>Username<input class="field" id="lu" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>' +
        '<label>Password<input class="field" id="lp" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>' +
        '<p class="login-err" id="lerr" role="alert" hidden>That username or password isn’t right.</p>' +
        '<div class="nav"><a class="text-btn" href="#" id="lback">Back to survey</a><button class="btn primary" type="button" id="lgo">Log in</button></div>' +
      '</div></div>';
    var f = document.getElementById('loginForm'), u = document.getElementById('lu'), pw = document.getElementById('lp'), err = document.getElementById('lerr');
    function tryLogin() {
      var pass = pw.value.trim().toLowerCase();
      if (cyrb53(u.value.trim().toUpperCase() + ':' + pass) === LOGIN_HASH) {
        setAuthed(true, pass);
        if (location.hash === '#results') renderAdmin(); else location.hash = 'results';
      } else {
        err.hidden = false; pw.value = ''; pw.focus();
        f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      }
    }
    document.getElementById('lgo').addEventListener('click', tryLogin);
    [u, pw].forEach(function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); tryLogin(); } }); });
    document.getElementById('lback').addEventListener('click', function (e) { e.preventDefault(); location.hash = ''; });
    toTop(); u.focus();
  }

  var adminRows = [];
  function renderAdmin() {
    if (!authed) return renderLogin();
    clearReset(); setView('admin'); A = {}; trail = [];
    if (TEST_MODE) return drawAdmin([]);
    if (!LIVE) return drawAdmin(loadAll());
    if (!adminPw) { setAuthed(false); return renderLogin(); }
    screen.innerHTML = '<div class="admin fade"><p class="label">Results</p><h1 class="q-title">Loading responses…</h1></div>';
    fetch(SHEET_URL + '?action=list&key=' + encodeURIComponent(adminPw))
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) { if (res && res.error === 'wrong password') { setAuthed(false); return renderLogin(); } throw new Error(); }
        drawAdmin(res.rows || []);
      })
      .catch(function () {
        screen.innerHTML = '<div class="admin fade"><p class="label">Results</p><h1 class="q-title">Couldn’t load responses.</h1><p class="q-help">Check your internet connection, then try again.</p><div class="tools"><button class="btn primary" id="reload">Try again</button></div></div>';
        document.getElementById('reload').addEventListener('click', renderAdmin);
      });
  }
  function drawAdmin(all) {
    adminRows = all;
    var where = TEST_MODE ? 'Test mode is on, so nothing is being saved yet.' : LIVE ? 'Responses come from your Google Sheet. Edit or delete them there.' : 'Saved in this browser on this computer only. Export a CSV to back them up.';
    var html = '<div class="admin fade"><p class="label">Results</p>' +
      '<p class="big-num">' + all.length + '<small>finished ' + (all.length === 1 ? 'response' : 'responses') + '</small></p>' +
      '<p class="q-help" style="margin:0">' + where + ' ' +
        (all.length ? all.filter(function (r) { return r.attention_ok === 'yes'; }).length + ' of ' + all.length + ' passed the attention check.' : '') + '</p>' +
      '<div class="tools"><button class="btn primary" id="csv"' + (all.length ? '' : ' disabled') + '>Export CSV</button>' +
      (LIVE || TEST_MODE ? '' : '<button class="btn secondary" id="wipe"' + (all.length ? '' : ' disabled') + '>Delete all</button>') +
      '<a class="text-btn" href="#" id="exit" style="margin-left:auto">Back to survey</a><button class="btn secondary" id="logout">Log out</button></div>';

    if (all.length) {
      var mt = {}, st = {};
      var ftc = {};
      all.forEach(function (r) { mt[r.makeup_type] = (mt[r.makeup_type] || 0) + 1; st[r.skincare_type] = (st[r.skincare_type] || 0) + 1; if (r.fragrance_type) ftc[r.fragrance_type] = (ftc[r.fragrance_type] || 0) + 1; });
      html += section('Makeup types', Object.keys(TYPES).map(function (k) { return TYPES[k][0]; }), mt, all.length, false, null, []);
      html += section('Skincare types', Object.keys(S_TYPES).map(function (k) { return S_TYPES[k][0]; }), st, all.length, false, null, []);
      html += section('Scent profiles', Object.keys(F_TYPES).map(function (k) { return F_TYPES[k][0]; }), ftc, all.length, false, null, []);
    }
    var lastPart = -1;
    REPORT.forEach(function (q) {
      if (q.part !== lastPart) { lastPart = q.part; html += '<h2 class="part-h">' + (q.part === 4 ? 'Wrapping up' : q.part === 0 ? 'Background' : 'Part ' + q.part + ' · ' + PART_NAMES[q.part]) + '</h2>'; }
      var got = all.filter(function (r) { return r[q.id] !== undefined; });
      if (q.textOnly) {
        html += '<div class="res"><h2 class="h2">' + esc(q.label) + '</h2><p class="mini" style="margin:0">' + got.length + ' answered</p>' +
          (got.length ? '<ul class="others">' + got.map(function (r) { return '<li>' + esc(r[q.id]) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
        return;
      }
      var counts = {}, order = q.numeric ? [] : q.options.slice();
      got.forEach(function (r) {
        var v = r[q.id];
        (Array.isArray(v) ? v : [v]).forEach(function (x) { x = String(x); if (order.indexOf(x) === -1) order.push(x); counts[x] = (counts[x] || 0) + 1; });
      });
      if (q.numeric) order.sort(function (a, b) { return a - b; });
      var others = []; (q.others || []).forEach(function (o) { got.forEach(function (r) { if (r[q.id + o[1]]) others.push((o[0] === 'Other' ? '' : o[0] + ': ') + r[q.id + o[1]]); }); });
      html += section(q.label, order, counts, got.length, q.multi, q.fmt, others);
    });
    screen.innerHTML = html + '</div>';

    document.getElementById('exit').addEventListener('click', function (e) { e.preventDefault(); location.hash = ''; });
    document.getElementById('logout').addEventListener('click', function () { setAuthed(false); location.hash = ''; });
    document.getElementById('csv').addEventListener('click', exportCsv);
    var wipe = document.getElementById('wipe'), armed = false;
    if (wipe) wipe.addEventListener('click', function () {
      if (!armed) { armed = true; wipe.textContent = 'Click again to delete'; setTimeout(function () { armed = false; if (wipe.isConnected) wipe.textContent = 'Delete all'; }, 3000); return; }
      saveAll([]); renderAdmin();
    });
    toTop();
  }
  function section(title, order, counts, total, multi, fmt, others) {
    var max = Math.max.apply(null, order.map(function (o) { return counts[o] || 0; }).concat([1]));
    return '<div class="res"><h2 class="h2">' + esc(title) + '</h2><p class="mini" style="margin:0">' + total + ' answered' + (multi ? ' · multi-select, so it can add past 100%' : '') + '</p>' +
      (total ? '<ol class="board">' + order.map(function (o) {
        var c = counts[o] || 0;
        return '<li><span class="nm"><span>' + esc(fmt ? fmt(o) : o) + '</span><span class="bar"><i style="width:' + Math.round(c / max * 100) + '%"></i></span></span><span class="n">' + c + ' · ' + pct(c, total) + '%</span></li>';
      }).join('') + '</ol>' : '') +
      (others.length ? '<ul class="others">' + others.map(function (t) { return '<li>' + (/^Other (online|in-person) store: /.test(t) ? '' : 'Other: ') + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
    '</div>';
  }
  function exportCsv() {
    var cols = ['submitted', 'seconds', 'section_order', 'attention_ok', 'makeup_path', 'makeup_type', 'skincare_type', 'fragrance_type'], heads = cols.slice();
    REPORT.forEach(function (q) {
      cols.push(q.id); heads.push(q.id + ': ' + q.label);
      (q.others || []).forEach(function (o) { cols.push(q.id + o[1]); heads.push(q.id + ': ' + o[0].toLowerCase() + ' (text)'); });
    });
    function cell(v) {
      var s = v == null ? '' : Array.isArray(v) ? v.join('; ') : String(v);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    var lines = [heads.map(cell).join(',')];
    adminRows.forEach(function (r) { lines.push(cols.map(function (c) { return cell(r[c]); }).join(',')); });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    a.download = 'adv-survey-responses-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ---------- start ---------- */
  function route() {
    if (location.hash === '#results') renderAdmin();
    else if (location.hash === '#login') { if (authed) location.hash = 'results'; else renderLogin(); }
    else renderIntro();
  }
  if (TEST_MODE) document.getElementById('testBand').hidden = false;
  loadTally();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
