<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCDS US AI Learning Hub</title>
<meta name="description" content="AI study tools for Greenwich Country Day Upper School classes, built to coach you instead of doing the work for you.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23F47B20'/%3E%3Cpath d='M26 6Q32 24 32 24Q32 24 38 6Z M4 30Q20 33 20 33Q20 33 4 38Z M60 30Q44 33 44 33Q44 33 60 38Z' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --black: #000000;
    --white: #ffffff;
    --orange: #F47B20;
    --orange-soft: #FDE6D3;
    --gray: #5c5c5c;
    --rule: #e3e3e3;
    --field: #f4f4f2;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--white); color: var(--black); font: 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 900; line-height: .92; letter-spacing: -.005em; margin: 0; text-transform: uppercase; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }

  /* ---------- nav ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: var(--black); color: var(--white); }
  .top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.02rem; letter-spacing: -.01em; }
  .brand svg { width: 38px; height: 38px; flex: none; }
  .brand span b { color: var(--orange); font-weight: 700; }
  .crumbs { margin-left: auto; display: flex; gap: 10px; font-size: .92rem; color: #b5b5b5; flex-wrap: wrap; justify-content: flex-end; }
  .crumbs a:hover { color: var(--orange); }
  .crumbs .here { color: var(--white); }

  main.wrap { padding-top: 0; padding-bottom: 96px; min-height: 60vh; }
  main:focus { outline: none; }

  /* ---------- stripes (signature) ---------- */
  .stripes { display: block; width: 100%; height: 150px; background: var(--orange); }
  .stripes.thin { height: 64px; }
  .bleed { margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }

  /* ---------- home hero ---------- */
  .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: end; padding: 72px 0 0; }
  .hero h1 { font-size: clamp(3.4rem, 9.5vw, 7.4rem); }
  .hero h1 .o { color: var(--orange); }
  .hero p { font-size: 1.2rem; color: var(--gray); max-width: 46ch; margin: 26px 0 40px; }
  .hero-tiger { width: 300px; height: auto; margin-bottom: -44px; position: relative; z-index: 2; }

  /* ---------- how it works ---------- */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 64px 0 72px; }
  .step { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
  .step .n { font-family: var(--display); font-weight: 900; font-size: 4.2rem; line-height: .8; color: var(--orange); }
  .step b { display: block; font-size: 1.12rem; margin-bottom: 4px; }
  .step span { color: var(--gray); font-size: .98rem; }

  /* ---------- subject list ---------- */
  .block-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; padding-bottom: 18px; border-bottom: 3px solid var(--black); }
  .block-head h2 { font-size: clamp(2.4rem, 5vw, 3.6rem); }
  .block-head p { margin: 0; color: var(--gray); max-width: 40ch; text-align: right; font-size: .98rem; }
  .group-name { font-weight: 600; font-size: .95rem; color: var(--gray); padding: 28px 0 8px; }
  .subj { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr) auto; gap: 28px; align-items: center;
    padding: 26px 0; border-bottom: 1px solid var(--rule); transition: background .18s, box-shadow .18s; }
  .subj h3 { font-size: clamp(2.6rem, 5vw, 4rem); }
  .subj p { margin: 0; color: var(--gray); }
  .subj .count { justify-self: end; font-weight: 600; font-size: .95rem; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .subj .count svg { width: 18px; height: 18px; transition: transform .18s; }
  .subj:hover, .subj:focus-visible { background: var(--orange); box-shadow: -18px 0 0 var(--orange), 18px 0 0 var(--orange); }
  .subj:hover p, .subj:focus-visible p { color: var(--black); }
  .subj:hover .count svg { transform: translateX(4px); }
  .subj.small h3 { font-size: clamp(2rem, 4vw, 3rem); }

  .notice { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; background: var(--black); color: var(--white);
    padding: 34px 36px; margin: 72px 0 0; border-radius: 4px; }
  .notice svg { width: 76px; height: 76px; }
  .notice h3 { font-size: 2rem; color: var(--orange); margin-bottom: 8px; }
  .notice p { margin: 0; color: #d4d4d4; max-width: 70ch; }

  /* ---------- page heads ---------- */
  .page-head { padding: 64px 0 40px; display: grid; gap: 16px; }
  .page-head .up { justify-self: start; font-weight: 600; font-size: .95rem; color: var(--gray); border-bottom: 2px solid var(--orange); }
  .page-head .up:hover { color: var(--black); }
  .page-head h1 { font-size: clamp(3.2rem, 9vw, 6.6rem); }
  .page-head h1 small { display: block; font-size: .42em; color: var(--gray); margin-top: 10px; }
  .page-head p { margin: 0; color: var(--gray); font-size: 1.12rem; max-width: 60ch; }

  .course-groups { padding-bottom: 20px; }
  .courses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; border-top: 3px solid var(--black); }
  .course { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0;
    border-bottom: 1px solid var(--rule); transition: background .18s, box-shadow .18s; }
  .course b { font-weight: 600; font-size: 1.12rem; }
  .course small { display: block; color: var(--gray); font-size: .9rem; }
  .course svg { width: 18px; height: 18px; flex: none; transition: transform .18s; }
  .course:hover, .course:focus-visible { background: var(--orange); box-shadow: -14px 0 0 var(--orange), 14px 0 0 var(--orange); }
  .course:hover small { color: var(--black); }
  .course:hover svg { transform: translateX(4px); }
  .course-groups .group-name { padding-top: 36px; }

  /* ---------- course page ---------- */
  .workspace { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 40px; align-items: start; padding-top: 8px; }
  .toollist { position: sticky; top: 88px; border-top: 3px solid var(--black); }
  .toollist h2 { font-family: var(--body); text-transform: none; font-weight: 600; font-size: .95rem; color: var(--gray); padding: 14px 0 6px; line-height: 1.4; }
  .tool-btn { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 16px 14px 18px; cursor: pointer;
    display: grid; gap: 2px; position: relative; transition: background .15s, color .15s; }
  .tool-btn b { font-weight: 600; font-size: 1.02rem; }
  .tool-btn span { color: var(--gray); font-size: .88rem; line-height: 1.4; }
  .tool-btn::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: transparent; transition: background .15s; }
  .tool-btn:hover { background: var(--field); }
  .tool-btn[aria-pressed="true"] { background: var(--black); color: var(--white); }
  .tool-btn[aria-pressed="true"] span { color: #c9c9c9; }
  .tool-btn[aria-pressed="true"]::before { background: var(--orange); }

  .panel { border: 3px solid var(--black); border-radius: 4px; padding: 30px; display: grid; gap: 20px; background: var(--white); }
  .panel h2 { font-size: clamp(2.4rem, 4.5vw, 3.4rem); }
  .panel .why { margin: 8px 0 0; color: var(--gray); }
  .field { display: grid; gap: 7px; }
  .field label { font-weight: 600; font-size: .96rem; }
  .field label i { font-style: normal; font-weight: 400; color: var(--gray); }
  .field input, .field textarea { width: 100%; background: var(--field); border: 2px solid transparent; border-radius: 4px; padding: 12px 14px; transition: border-color .15s, background .15s; }
  .field textarea { min-height: 116px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--orange); background: var(--white); }

  .preview { background: var(--black); color: var(--white); border-radius: 4px; padding: 20px 22px; }
  .preview .label { display: flex; justify-content: space-between; font-weight: 600; font-size: .9rem; color: #a8a8a8; margin-bottom: 10px; }
  .preview pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font: .93rem/1.6 var(--body); max-height: 280px; overflow: auto; }
  .preview mark { background: none; color: var(--orange); font-weight: 600; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px; border: 2px solid var(--black);
    background: var(--white); font-weight: 600; font-size: .98rem; cursor: pointer; transition: background .15s, color .15s, transform .1s; }
  .btn:hover { background: var(--black); color: var(--white); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: var(--black); }
  .btn.primary:hover { background: var(--black); border-color: var(--black); color: var(--orange); }
  .btn svg { width: 14px; height: 14px; }
  .fine { font-size: .9rem; color: var(--gray); margin: 0; }

  .below { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
  .below h3 { font-size: 1.9rem; padding-bottom: 10px; border-bottom: 3px solid var(--black); margin-bottom: 14px; }
  .below ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--gray); }
  .below p { margin: 0; color: var(--gray); }
  .res { display: grid; }
  .res a { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--rule); font-weight: 600; }
  .res a small { display: block; font-weight: 400; color: var(--gray); }
  .res a:hover { color: var(--orange); }

  .after { padding-bottom: 96px; }

  /* ---------- footer ---------- */
  footer { background: var(--black); color: #bdbdbd; }
  footer .wrap { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; padding-top: 34px; padding-bottom: 40px; font-size: .92rem; }
  footer .who { display: flex; align-items: center; gap: 14px; }
  footer svg.mark { width: 44px; height: 44px; flex: none; }
  footer b { color: var(--white); font-weight: 600; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; background: var(--black); color: var(--white);
    border-left: 5px solid var(--orange); padding: 12px 20px; border-radius: 4px; font-weight: 500; transition: .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- scroll reveal ---------- */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); transition-delay: var(--d, 0s); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding-top: 48px; }
    .hero-tiger { width: 190px; justify-self: end; margin: -20px 0 -32px; }
    .steps { grid-template-columns: 1fr; gap: 26px; padding: 48px 0; }
    .subj { grid-template-columns: 1fr auto; gap: 6px 16px; }
    .subj p { grid-column: 1 / -1; grid-row: 2; }
    .subj .count { grid-row: 1; grid-column: 2; }
    .block-head { flex-direction: column; align-items: start; }
    .block-head p { text-align: left; }
    .courses { grid-template-columns: 1fr; }
    .workspace { grid-template-columns: 1fr; gap: 28px; }
    .toollist { position: static; }
    .below { grid-template-columns: 1fr; }
    .notice { grid-template-columns: 1fr; padding: 28px; }
    .crumbs { display: none; }
    .panel { padding: 22px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="GCDS AI Learning Hub home"><svg aria-hidden="true"><use href="#tiger"/></svg><span>GCDS <b>US</b> AI Learning Hub</span></a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <div class="who"><svg class="mark" aria-hidden="true"><use href="#tiger"/></svg>
      <span><b>GCDS US AI Learning Hub</b><br>A student project by Mary Chickering for the GCDS AI competition. Not an official GCDS site.</span></div>
    <span>Follow your teacher's AI policy and the Honor Code.</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- original tiger mark, reused everywhere via <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tiger" viewBox="0 0 100 100">
    <circle cx="20" cy="22" r="14" fill="#F47B20"/><circle cx="80" cy="22" r="14" fill="#F47B20"/>
    <circle cx="20" cy="22" r="7" fill="#000"/><circle cx="80" cy="22" r="7" fill="#000"/>
    <path d="M50 12C75 12 92 30 92 54C92 78 74 94 50 94C26 94 8 78 8 54C8 30 25 12 50 12Z" fill="#F47B20"/>
    <path d="M50 66C64 66 74 72 74 81C74 90 63 95 50 95C37 95 26 90 26 81C26 72 36 66 50 66Z" fill="#fff"/>
    <path d="M44 12Q50 34 50 34Q50 34 56 12Z" fill="#000"/>
    <path d="M32 15Q40 30 41 31Q38 22 39 13Z" fill="#000"/>
    <path d="M68 15Q60 30 59 31Q62 22 61 13Z" fill="#000"/>
    <path d="M8 46Q24 50 27 52Q22 54 9 56Z" fill="#000"/>
    <path d="M10 64Q24 64 26 65Q22 68 13 72Z" fill="#000"/>
    <path d="M92 46Q76 50 73 52Q78 54 91 56Z" fill="#000"/>
    <path d="M90 64Q76 64 74 65Q78 68 87 72Z" fill="#000"/>
    <ellipse cx="35" cy="51" rx="6.5" ry="5" fill="#000"/><ellipse cx="65" cy="51" rx="6.5" ry="5" fill="#000"/>
    <circle cx="37" cy="49.5" r="1.8" fill="#fff"/><circle cx="67" cy="49.5" r="1.8" fill="#fff"/>
    <path d="M43 68Q50 64 57 68Q54 74 50 75Q46 74 43 68Z" fill="#000"/>
    <path d="M50 75V81M50 81Q45 85 41 82M50 81Q55 85 59 82" stroke="#000" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </symbol>
  <symbol id="go" viewBox="0 0 20 20"><path d="M3 10h13M11 5l5 5-5 5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ext" viewBox="0 0 14 14"><path d="M4 2h8v8M12 2 2 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<script>
const SUBJECTS = [
  {
    id: "math", name: "Math", glyph: "∑", stem: true, tools: "math",
    blurb: "Hints instead of answers, step-by-step work checks, and practice quizzes.",
    groups: [
      { name: "Core sequence", courses: [
        ["algebra-1", "Algebra I"], ["geometry-concepts", "Geometry Concepts"], ["geometry", "Geometry"],
        ["algebra-2", "Algebra II"], ["algebra-2-trig", "Algebra II & Trig"], ["precalc-concepts", "Pre-Calc Concepts"],
        ["precalc", "Pre-Calc"], ["calculus", "Calculus"], ["statistics", "Statistics"] ] },
      { name: "Honors", courses: [
        ["honors-geometry", "Honors Geometry"], ["honors-algebra-2", "Honors Algebra II"],
        ["honors-precalc", "Honors Pre-Calc"], ["honors-calculus", "Honors Calculus"] ] },
      { name: "Advanced (AAM)", courses: [
        ["aam-adv-calc", "AAM: Advanced Calculus"], ["aam-adv-stats", "AAM: Advanced Statistics"],
        ["aam-multivariable", "AAM: Multivariable"], ["aam-discrete", "AAM: Discrete"] ] }
    ]
  },
  {
    id: "science", name: "Science", glyph: "⚗", stem: true, tools: "science",
    blurb: "Concept checks, problem hints, and lab report feedback that doesn't rewrite your work.",
    groups: [
      { name: "Core", courses: [
        ["biology", "Biology"], ["chemistry", "Chemistry"], ["physics", "Physics"] ] },
      { name: "Honors", courses: [
        ["honors-chemistry", "Honors Chemistry"], ["honors-physics", "Honors Physics"],
        ["honors-environmental", "Honors Environmental Science"] ] },
      { name: "Electives", courses: [
        ["environmental", "Environmental Science"], ["psychology", "Psychology"],
        ["marine-science", "Marine Science"], ["intro-stem", "Intro to STEM"] ] },
      { name: "Advanced (AAS)", courses: [
        ["aas-biology", "AAS: Biology"], ["aas-chemistry", "AAS: Chemistry"],
        ["aas-physics-eng", "AAS: Physics & Engineering"], ["aas-eco-eng", "AAS: Eco Engineering"] ] }
    ]
  },
  {
    id: "cs", name: "CS & Engineering", glyph: "</>", stem: true, tools: "cs",
    blurb: "A debugging coach that points you at the bug without fixing it for you.",
    groups: [
      { name: "Computer Science", courses: [
        ["cs-1", "Computer Science I"], ["cs-2", "Computer Science II"], ["csx", "CSX"],
        ["csda", "CSDA"], ["adv-csda", "Advanced CSDA"], ["csal", "CSAL"] ] },
      { name: "Engineering", courses: [
        ["fund-engineering", "Fundamentals of Engineering"] ] }
    ]
  },
  {
    id: "english", name: "English", glyph: "Aa", stem: false, tools: "english",
    blurb: "English 9 and 10 only. Reading checks, close reading, Harkness prep, and essay feedback.",
    groups: [
      { name: "Grade-level courses", courses: [
        ["english-9", "English 9", "Identity & Society",
          "Taught with History 9 as part of the 9th grade Global Studies program, through the lens of personal identity."],
        ["english-10", "English 10", "American Studies: Literature",
          "Taught with History 10 as part of the 10th grade American Studies program."] ] }
    ]
  },
  {
    id: "history", name: "History", glyph: "⌛", stem: false, tools: "history",
    blurb: "History 9 and 10 only. Source analysis, debate practice, and thesis testing.",
    groups: [
      { name: "Grade-level courses", courses: [
        ["history-9", "History 9", "Global History",
          "Social Sciences 9. Covers how societies are organized, trade and migration, revolutions and empires, cultural achievements, and imperialism and colonialism. Taught with English 9."],
        ["history-10", "History 10", "American Studies: History",
          "Social Sciences 10. American history from the 1600s through the 1900s, built around power and systems: freedom, progress, and democracy. Taught with English 10."] ] }
    ]
  }
];

// Class-made tools for specific courses go here, keyed by course id.
const RESOURCES = {
  // "biology": [{ title: "Unit 1 Study Guide", url: "https://...", note: "Macromolecules, enzymes" }],
};

/* ============================================================
   TOOLS: every prompt tells the AI to coach, not do the work.
   ============================================================ */
const T = {
  hint: {
    name: "Hint tutor", short: "Stuck on a problem? Get one hint at a time.",
    why: "You get unstuck without getting the answer handed to you.",
    fields: [
      { k: "problem", label: "The problem", area: true, ph: "Paste or type the problem exactly as written" },
      { k: "tried", label: "What you've tried so far", opt: true, area: true, ph: "Even a wrong start helps the AI see where you're stuck" }
    ],
    build: (c, v) => `${intro(c)} I'm stuck on this problem:

${v.problem}
${v.tried ? `\nHere's what I've tried so far:\n${v.tried}\n` : ""}
Rules for helping me:
- Do NOT give me the final answer or solve the whole thing.
- Give me ONE small hint at a time, then wait for me to try the next step.
- If I make a mistake, point to where it is and ask a question that helps me see it.
- Only confirm the answer after I've gotten there myself.`
  },
  check: {
    name: "Check my work", short: "Find the first mistake in your solution.",
    why: "You find out exactly where you went wrong, then fix it yourself.",
    fields: [
      { k: "problem", label: "The problem", area: true, ph: "Paste the problem" },
      { k: "work", label: "Your full solution", area: true, ph: "Write out every step, not just the answer" }
    ],
    build: (c, v) => `${intro(c)} Here's a problem and my full solution. Check it step by step.

Problem:
${v.problem}

My work:
${v.work}

Rules:
- If everything is right, tell me and ask me one harder follow-up question on the same idea.
- If there's a mistake, tell me which step it's in and why it's wrong, but do NOT redo the problem for me.
- Let me fix it and send it back, then check it again.`
  },
  quiz: {
    name: "Practice quiz", short: "Get quizzed one question at a time.",
    why: "Testing yourself beats rereading notes. This is how you actually remember stuff.",
    fields: [
      { k: "topic", label: "Unit or topics", ph: "e.g. limiting reagents, stoichiometry" },
      { k: "notes", label: "Notes or vocab from class", opt: true, area: true, ph: "Paste class notes so the questions match what your teacher covered" }
    ],
    build: (c, v) => `${intro(c)} Quiz me on: ${v.topic}.
${v.notes ? `\nUse these class notes so the questions match what we covered:\n${v.notes}\n` : ""}
Rules:
- Ask ONE question at a time and wait for my answer.
- Mix quick recall with questions that make me explain my reasoning or apply the idea.
- After each answer, tell me if I'm right and briefly explain any mistake. Then ask the next one.
- If I miss something, come back to it later in a different form.
- After 10 questions, tell me what I'm solid on and what I should review.`
  },
  explain: {
    name: "Explain it back", short: "Teach the AI a concept. It finds your gaps.",
    why: "If you can't explain it, you don't know it yet. This shows you exactly what's missing.",
    fields: [
      { k: "concept", label: "Concept", ph: "e.g. how enzymes lower activation energy" },
      { k: "explanation", label: "Your explanation, in your own words", area: true, ph: "Write it like you're teaching a friend who missed class" }
    ],
    build: (c, v) => `${intro(c)} I'm going to explain a concept in my own words: ${v.concept}.

My explanation:
${v.explanation}

Rules:
- Don't re-explain the whole concept to me.
- Tell me what I got right, what's missing, and anything that's wrong or vague.
- Then ask me 2 follow-up questions that test whether I really get it, one at a time.`
  },
  plan: {
    name: "Test prep plan", short: "Turn a test date into a daily study plan.",
    why: "Spreading out practice works way better than cramming the night before.",
    fields: [
      { k: "when", label: "When is the test?", ph: "e.g. next Friday" },
      { k: "topics", label: "What's on it", area: true, ph: "List the topics or paste the study guide" },
      { k: "time", label: "Time you have per day", opt: true, ph: "e.g. 30 minutes" }
    ],
    build: (c, v) => `${intro(c)} I have a test ${v.when}. It covers:
${v.topics}
${v.time ? `\nI have about ${v.time} per day to study.\n` : ""}
Make me a day-by-day study plan using active recall and spaced practice, not rereading notes. For each day, tell me exactly what to practice and how. Put my hardest topics earlier so I have time to come back to them.

Then start Day 1 right now by quizzing me, one question at a time.`
  },
  lab: {
    name: "Lab report coach", short: "Feedback on claim, evidence, and reasoning.",
    why: "You learn what a strong lab argument looks like, and it's still your writing.",
    fields: [
      { k: "lab", label: "What was the lab?", ph: "e.g. catalase and hydrogen peroxide concentration" },
      { k: "section", label: "Which section", ph: "e.g. conclusion, error analysis" },
      { k: "draft", label: "Your draft", area: true, ph: "Paste your section" }
    ],
    build: (c, v) => `${intro(c)} I'm writing a lab report on: ${v.lab}. Here's my ${v.section || "section"}:

${v.draft}

Give me feedback using claim, evidence, and reasoning:
- Is my claim clear and does it actually answer the question?
- Is it backed by my specific data, or am I being vague?
- Does my reasoning explain WHY, using the science?
- Point out any science that's wrong.

Do NOT rewrite any sentences for me. Give specific comments I can act on, and quote the part of my draft each comment is about.`
  },
  debug: {
    name: "Debug coach", short: "Find your own bug with guided questions.",
    why: "Debugging is the actual skill. This trains it instead of skipping it.",
    fields: [
      { k: "lang", label: "Language", ph: "e.g. Python, Java" },
      { k: "goal", label: "What should it do?", ph: "e.g. return the largest number in the list" },
      { k: "happens", label: "What happens instead / error message", area: true, ph: "Paste the error or describe the wrong output" },
      { k: "code", label: "Your code", area: true, ph: "Paste the code" }
    ],
    build: (c, v) => `${intro(c)} My ${v.lang || "code"} isn't working.

What it should do: ${v.goal}
What happens instead: ${v.happens}

My code:
${v.code}

Rules:
- Do NOT rewrite my code or give me a fixed version.
- Ask me questions that help me find the bug myself (like what a variable holds at a certain line).
- Narrow it down one step at a time. Point me to the right area, not the exact fix.
- Once I've fixed it, ask me one question about why the bug happened so I don't repeat it.`
  },
  reading: {
    name: "Reading check", short: "Make sure you actually got the reading.",
    why: "No summaries. It asks you questions and sends you back to the text when you miss.",
    fields: [
      { k: "text", label: "What you're reading", ph: "Title and author" },
      { k: "section", label: "Section you just read", ph: "e.g. chapters 4-6" }
    ],
    build: (c, v) => `${intro(c)} I'm reading ${v.text} and just finished ${v.section}.

Do NOT summarize it for me. Ask me 6 questions, one at a time:
- Start with what happened and who's involved.
- Move to why characters act the way they do.
- End with bigger questions about themes and what the author is doing.

If I get something wrong, tell me what part of the text to go reread instead of giving me the answer.`
  },
  close: {
    name: "Close reading coach", short: "Work through a passage line by line.",
    why: "You build your own analysis instead of borrowing one.",
    fields: [
      { k: "text", label: "Book or text", ph: "Title and author" },
      { k: "passage", label: "The passage", area: true, ph: "Paste the passage or quote" }
    ],
    build: (c, v) => `${intro(c)} Help me close read this passage from ${v.text}:

"${v.passage}"

Do NOT analyze it for me. Instead:
- Ask me questions one at a time about specific word choices, images, structure, and tone.
- Push me to connect what I notice to a bigger theme or idea in the book.
- At the end, have me write 2-3 sentences of analysis and give me feedback on them.`
  },
  harkness: {
    name: "Harkness prep", short: "Pressure-test your points before discussion.",
    why: "You walk in with sharper ideas and good questions, and they're still yours.",
    fields: [
      { k: "topic", label: "Text or topic for discussion", ph: "e.g. The Great Gatsby, chapters 1-3" },
      { k: "ideas", label: "Points you're thinking of bringing up", area: true, ph: "Rough is fine" }
    ],
    build: (c, v) => `${intro(c)} I have a Harkness discussion on ${v.topic}. Here's what I'm thinking of bringing up:

${v.ideas}

Act like a sharp classmate at the table:
- Push back on my points one at a time and let me respond.
- Ask me what specific evidence supports each one.
- Bring up a counterargument I'd have to answer.
- At the end, help me turn my ideas into 2 open questions I could ask the table.

Do NOT give me new points to say. Help me sharpen mine.`
  },
  thesis: {
    name: "Thesis stress test", short: "Find out if your thesis can hold up.",
    why: "Fixing the thesis first saves you from rewriting the whole essay later.",
    fields: [
      { k: "prompt", label: "Essay prompt", area: true, ph: "Paste the prompt" },
      { k: "thesis", label: "Your thesis", area: true, ph: "Paste your thesis" }
    ],
    build: (c, v) => `${intro(c)} Here's my essay prompt:
${v.prompt}

My thesis:
${v.thesis}

Stress test it:
- Is it arguable, specific, and actually answering the prompt?
- What's the strongest counterargument someone could make?
- What would I need to prove in my body paragraphs?
- Ask me questions that help me make it sharper.

Do NOT write a new thesis for me.`
  },
  paragraph: {
    name: "Paragraph feedback", short: "Comments only. No rewriting.",
    why: "You get a teacher-style read on your writing without losing your voice.",
    fields: [
      { k: "prompt", label: "Essay prompt or thesis", opt: true, area: true, ph: "Helps the feedback stay on target" },
      { k: "para", label: "Your paragraph", area: true, ph: "Paste one body paragraph" }
    ],
    build: (c, v) => `${intro(c)} Here's a body paragraph from my essay.
${v.prompt ? `\nPrompt/thesis: ${v.prompt}\n` : ""}
Paragraph:
${v.para}

Give me feedback on:
- Topic sentence: is the claim clear?
- Evidence: is it the strongest choice, and is it set up well?
- Analysis: am I explaining HOW the evidence proves my point, or just summarizing?
- Flow and clarity.

Comment only. Do NOT rewrite any of my sentences. Quote the part each comment is about.`
  },
  source: {
    name: "Source analysis coach", short: "Work through a primary source.",
    why: "Sourcing is the core history skill. This makes you do it, not watch it.",
    fields: [
      { k: "info", label: "Source info", ph: "Who made it, when, what kind of source" },
      { k: "text", label: "The source", area: true, ph: "Paste the text, or describe the image" }
    ],
    build: (c, v) => `${intro(c)} I'm analyzing this source: ${v.info}

${v.text}

Coach me through it one question at a time:
- Sourcing: who made it and why does that matter?
- Context: what was going on at the time?
- Purpose and audience: who was it for and what was it trying to do?
- Point of view: what's missing or slanted?

Do NOT tell me the answers. At the end, ask me what this source can and can't tell a historian, and give me feedback.`
  },
  debate: {
    name: "Debate the other side", short: "Argue against an AI that disagrees with you.",
    why: "You find the weak spots in your argument before your teacher does.",
    fields: [
      { k: "claim", label: "Your argument", area: true, ph: "e.g. Trade did more to spread ideas than empire did" }
    ],
    build: (c, v) => `${intro(c)} I'm arguing that:
${v.claim}

Take the opposite side and argue against me using real historical evidence. Go one round at a time and wait for me to respond. Keep it accurate and tell me if I state something that isn't true.

After 4 rounds, tell me which of my points held up, which were weakest, and what evidence I should look into.`
  }
};

const TOOLSETS = {
  math: ["hint", "check", "quiz", "explain", "plan"],
  science: ["hint", "explain", "quiz", "lab", "plan"],
  cs: ["debug", "hint", "explain", "quiz", "plan"],
  english: ["reading", "close", "harkness", "thesis", "paragraph"],
  history: ["source", "debate", "harkness", "thesis", "quiz"]
};


/* ============================================================ */
const COURSES = {};
SUBJECTS.forEach(s => s.groups.forEach(g => g.courses.forEach(([id, name, sub, desc]) => {
  COURSES[id] = { id, name, sub, desc, subject: s };
})));

let current = null;
function intro(c) {
  const full = c.sub ? `${c.name}: ${c.sub}` : c.name;
  return `I'm a high school student at Greenwich Country Day School taking ${full}.`;
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const icon = (id, cls = "") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

/* tiger stripes: tapered strokes from both edges, seeded so they look the same every visit */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function stripes(seed, h = 150, cls = "") {
  const r = rng(seed), W = 1600; let x = 10, top = r() > .5, d = "";
  const spike = (x, w, len, bend, fromTop) => {
    const y = v => fromTop ? v : h - v;
    return `M${x - w / 2},${y(0)} C${x - w / 2 + bend * .3},${y(len * .5)} ${x + bend - 2},${y(len * .85)} ${x + bend},${y(len)} C${x + bend + 2},${y(len * .85)} ${x + w / 2 + bend * .3},${y(len * .5)} ${x + w / 2},${y(0)}Z`;
  };
  while (x < W) {
    const w = 16 + r() * 22, len = h * (.38 + r() * .5), bend = (r() - .5) * 46;
    d += spike(x, w, len, bend, top);
    if (r() > .62) d += spike(x + w * .55, w * .45, len * .5, bend * 1.4 + 10, top);
    x += 30 + r() * 46; top = r() > .35 ? !top : top;
  }
  return `<svg class="stripes ${cls}" viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="${d}" fill="#000"/></svg>`;
}

function crumbs(items) {
  $("#crumbs").innerHTML = items.map(([label, href], i) =>
    href ? `<a href="${href}">${esc(label)}</a><span aria-hidden="true">/</span>` : `<span class="here">${esc(label)}</span>`).join("");
}

function subjRow(s, i, small) {
  const n = s.groups.reduce((a, g) => a + g.courses.length, 0);
  return `<a class="subj reveal${small ? " small" : ""}" style="--d:${i * .07}s" href="#/${s.id}">
    <h3>${esc(s.name)}</h3><p>${esc(s.blurb)}</p>
    <span class="count">${n} course${n === 1 ? "" : "s"} ${icon("go")}</span></a>`;
}

function renderHome() {
  crumbs([]);
  document.title = "GCDS US AI Learning Hub";
  const stem = SUBJECTS.filter(s => s.stem), other = SUBJECTS.filter(s => !s.stem);
  $("#app").innerHTML = `
    <section class="hero">
      <div class="reveal">
        <h1>Study with AI. Do the thinking yourself.</h1>
        <p>Tools for Upper School classes that coach you through problems, readings and essays instead of handing you the answers.</p>
      </div>
      <svg class="hero-tiger reveal" style="--d:.15s" viewBox="0 0 100 100" role="img" aria-label="Tiger"><use href="#tiger"/></svg>
    </section>
    <div class="bleed">${stripes(911)}</div>
    <section class="steps" aria-label="How it works">
      <div class="step reveal"><span class="n">1</span><div><b>Pick your class</b><span>Choose a subject, then the course you're taking.</span></div></div>
      <div class="step reveal" style="--d:.08s"><span class="n">2</span><div><b>Choose a tool</b><span>Fill in what you're working on. The hub writes the prompt for you.</span></div></div>
      <div class="step reveal" style="--d:.16s"><span class="n">3</span><div><b>Open it in an AI</b><span>Send it to Claude or ChatGPT and answer its questions yourself.</span></div></div>
    </section>
    <section>
      <div class="block-head reveal"><h2>Pick a subject</h2><p>STEM classes come first. English and History cover grades 9 and 10.</p></div>
      <div class="group-name reveal">STEM</div>
      ${stem.map((s, i) => subjRow(s, i)).join("")}
      <div class="group-name reveal">English and History</div>
      ${other.map((s, i) => subjRow(s, i, true)).join("")}
    </section>
    <section class="notice reveal">
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#tiger"/></svg>
      <div><h3>Not every course is here</h3>
      <p>The hub only covers classes that share a standard curriculum across sections, so every tool fits what the whole class is learning. Electives with section-specific content and Seminar aren't included. Want your class added? Ask your teacher to reach out.</p></div>
    </section>
  `;
}

function renderSubject(s) {
  crumbs([["Hub", "#/"], [s.name]]);
  document.title = `${s.name} · GCDS AI Learning Hub`;
  $("#app").innerHTML = `
    <section class="page-head">
      <a class="up reveal" href="#/">All subjects</a>
      <h1 class="reveal">${esc(s.name)}</h1>
      <p class="reveal">${esc(s.blurb)}</p>
    </section>
    <div class="course-groups">
    ${s.groups.map(g => `
      <div class="group-name reveal">${esc(g.name)}</div>
      <div class="courses">${g.courses.map(([id, name, sub], i) =>
        `<a class="course reveal" style="--d:${(i % 8) * .05}s" href="#/${s.id}/${id}"><span><b>${esc(name)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span>${icon("go")}</a>`).join("")}
      </div>`).join("")}
    </div>
    <section class="notice reveal">
      <svg viewBox="0 0 100 100" aria-hidden="true"><use href="#tiger"/></svg>
      <div><h3>Don't see your class?</h3><p>Only courses with a shared curriculum across sections are included right now.</p></div>
    </section>
  `;
}

function renderCourse(c) {
  const s = c.subject;
  crumbs([["Hub", "#/"], [s.name, `#/${s.id}`], [c.name]]);
  document.title = `${c.name} · GCDS AI Learning Hub`;
  const tools = TOOLSETS[s.tools];
  const res = RESOURCES[c.id] || [];
  $("#app").innerHTML = `
    <section class="page-head">
      <a class="up reveal" href="#/${s.id}">${esc(s.name)}</a>
      <h1 class="reveal">${esc(c.name)}${c.sub ? `<small>${esc(c.sub)}</small>` : ""}</h1>
      <p class="reveal">${c.desc ? esc(c.desc) : `Pick a tool, fill in what you're working on, and open it in an AI.`}</p>
    </section>
    <div class="workspace">
      <div class="toollist reveal" role="group" aria-label="Tools">
        <h2>Tools for ${esc(c.name)}</h2>
        ${tools.map((t, i) => `<button class="tool-btn" data-tool="${t}" aria-pressed="${i === 0}"><b>${esc(T[t].name)}</b><span>${esc(T[t].short)}</span></button>`).join("")}
      </div>
      <div class="reveal" style="--d:.1s">
        <div class="panel" id="panel"></div>
        <div class="below">
          <div><h3>How to use it</h3><ol>
            <li>Fill in the boxes. Anything you leave blank shows up in orange so you can fill it in later.</li>
            <li>Open it in Claude or ChatGPT, or copy the prompt.</li>
            <li>Answer the AI's questions yourself. That's where the learning happens.</li>
          </ol></div>
          <div><h3>Class-made tools</h3>${res.length
            ? `<div class="res">${res.map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener"><span>${esc(r.title)}${r.note ? `<small>${esc(r.note)}</small>` : ""}</span>${icon("ext")}</a>`).join("")}</div>`
            : `<p>Study guides, practice tests and simulations made for ${esc(c.name)} will show up here.</p>`}</div>
        </div>
      </div>
    </div>
  `;
  document.querySelectorAll(".tool-btn").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".tool-btn").forEach(x => x.setAttribute("aria-pressed", x === b));
    showTool(c, b.dataset.tool);
    if (window.innerWidth <= 900) $("#panel").scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  showTool(c, tools[0]);
}

const drafts = {};
function showTool(c, toolId) {
  const t = T[toolId];
  const key = c.id + ":" + toolId;
  const vals = drafts[key] || (drafts[key] = {});
  current = { c, t, vals };
  $("#panel").innerHTML = `
    <div><h2>${esc(t.name)}</h2><p class="why">${esc(t.why)}</p></div>
    ${t.fields.map(f => `<div class="field">
      <label for="f-${f.k}">${esc(f.label)}${f.opt ? " <i>(optional)</i>" : ""}</label>
      ${f.area
        ? `<textarea id="f-${f.k}" data-k="${f.k}" placeholder="${esc(f.ph)}">${esc(vals[f.k] || "")}</textarea>`
        : `<input id="f-${f.k}" data-k="${f.k}" placeholder="${esc(f.ph)}" value="${esc(vals[f.k] || "")}">`}
    </div>`).join("")}
    <div class="preview"><div class="label"><span>Your prompt</span></div><pre id="out"></pre></div>
    <div class="actions">
      <a class="btn primary" id="open-claude" target="_blank" rel="noopener">Open in Claude ${icon("ext")}</a>
      <a class="btn" id="open-gpt" target="_blank" rel="noopener">Open in ChatGPT ${icon("ext")}</a>
      <button class="btn" id="copy">Copy prompt</button>
    </div>
    <p class="fine">Check your teacher's AI policy before using AI on graded work.</p>
  `;
  $("#panel").querySelectorAll("[data-k]").forEach(el => el.addEventListener("input", () => { vals[el.dataset.k] = el.value; update(); }));
  $("#copy").addEventListener("click", copyPrompt);
  update();
}

function promptText(markup) {
  const { c, t, vals } = current;
  const v = {};
  t.fields.forEach(f => {
    const val = (vals[f.k] || "").trim();
    if (val) v[f.k] = val;
    else v[f.k] = f.opt ? "" : (markup ? `\u0000[${f.label.toLowerCase()}]\u0001` : `[${f.label.toLowerCase()}]`);
  });
  let out = t.build(c, v).replace(/\n{3,}/g, "\n\n").trim();
  if (markup) out = esc(out).replace(/\u0000([^\u0001]*)\u0001/g, "<mark>$1</mark>");
  return out;
}

function update() {
  const plain = promptText(false);
  $("#out").innerHTML = promptText(true);
  $("#open-claude").href = "https://claude.ai/new?q=" + encodeURIComponent(plain);
  $("#open-gpt").href = "https://chatgpt.com/?q=" + encodeURIComponent(plain);
}

async function copyPrompt() {
  const text = promptText(false);
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("Prompt copied. Paste it into any AI.");
}

let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

/* fade things in as they scroll into view */
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12, rootMargin: "0px 0px -40px 0px" })
  : null;
function reveal() {
  document.querySelectorAll(".reveal:not(.in)").forEach(el => io ? io.observe(el) : el.classList.add("in"));
}

function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const s = SUBJECTS.find(x => x.id === parts[0]);
  const c = parts[1] && COURSES[parts[1]];
  if (s && c && c.subject === s) renderCourse(c);
  else if (s) renderSubject(s);
  else renderHome();
  window.scrollTo(0, 0);
  $("#app").focus({ preventScroll: true });
  reveal();
}
document.querySelector("footer").insertAdjacentHTML("beforebegin", stripes(27, 64, "thin"));
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
